<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Оформление заказа</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        body { font-family: sans-serif; padding: 20px; background: var(--tg-theme-bg-color); color: var(--tg-theme-text-color); }
        input { width: 100%; padding: 10px; margin: 10px 0; box-sizing: border-box; border-radius: 5px; border: 1px solid #ccc; }
        .btn { width: 100%; padding: 12px; margin-top: 10px; border: none; border-radius: 5px; font-size: 16px; cursor: pointer; }
        .btn-pay { background: #28a745; color: white; }
        .btn-submit { background: var(--tg-theme-button-color); color: var(--tg-theme-button-text-color); }
    </style>
</head>
<body>
    <h2>Детали заказа</h2>
    
    <label>ФИО:</label>
    <input type="text" id="fio" placeholder="Иванов Иван Иванович">
    
    <label>Куда доставить:</label>
    <input type="text" id="address" placeholder="Номер НВК, комната">
    
    <!-- Кнопка для открытия ссылки на оплату -->
    <button class="btn btn-pay" onclick="openPayment()">Оплатить заказ 💳</button>
    
    <!-- Кнопка для отправки данных обратно в бота -->
    <button class="btn btn-submit" onclick="sendData()">Продолжить (после оплаты)</button>

    <script>
        let tg = window.Telegram.WebApp;
        tg.expand();

        // Функция открытия ссылки на оплату
        function openPayment() {
            const paymentUrl = "https://example.com/pay"; // Замените на вашу реальную ссылку
            tg.openLink(paymentUrl);
        }

        function sendData() {
            let fio = document.getElementById('fio').value;
            let address = document.getElementById('address').value;
            
            if (!fio || !address) {
                tg.showAlert("Пожалуйста, заполните все поля");
                return;
            }

            let data = JSON.stringify({
                fio: fio,
                address: address,
                status: "Перешел к оплате" // Дополнительный маркер для бота
            });
            
            tg.sendData(data);
        }
    </script>
</body>
</html>
